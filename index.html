<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C2740">
<title>보상관리사 반복학습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div id="root"></div>
<style>
  :root{
    --bg:#E7EBEE; --surface:#FFFFFF; --surface-2:#F3F5F7;
    --ink:#1C2740; --ink-2:#33405C; --muted:#6B7684; --faint:#9AA4AE;
    --line:#D6DBDF; --line-2:#E4E8EB;
    --seal:#B23A3A; --seal-soft:#E8CBC7;
    --correct:#2E7D57; --correct-bg:#E3F1EA;
    --wrong:#C1443C; --wrong-bg:#F7E3E1;
    --gold:#A9791F;
    --b0:#D9DEE2; --b1:#E4B6AF; --b2:#E9CF9C; --b3:#D2DBB4; --b4:#A6C7AC; --b5:#2E7D57;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Pretendard,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono",ui-monospace,"D2Coding",Menlo,Consolas,monospace;
  }
  body[data-stage="2"]{--bg:#EBE7E0;--surface:#FFFDF9;--surface-2:#F5F1EB;--line:#DDD8D0;--line-2:#E8E3DC;--ink:#2D2518;--ink-2:#4A3F2F;--seal:#8A5A1F}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  #root{max-width:940px;margin:0 auto;padding:22px 18px 64px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}

  /* Mastery grid */
  .plots{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
  .plot{aspect-ratio:1;border-radius:2px;background:var(--b0);position:relative;transition:background .4s ease}
  .plot.new{box-shadow:inset 0 0 0 1px var(--line-2)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

  /* Stat rows */
  .statline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
  .statline:last-child{border-bottom:none}
  .statline .k{font-size:13px;color:var(--muted)}
  .statline .v{font-size:15px;font-weight:700}
  .streak .v{color:var(--seal)}

  .subj-bars{display:flex;flex-direction:column;gap:13px;margin-top:4px}
  .subj .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .subj .top b{font-weight:700}
  .subj .top .n{color:var(--muted);font-family:var(--mono);font-size:11.5px}
  .track{height:7px;background:var(--surface-2);border-radius:20px;overflow:hidden;border:1px solid var(--line-2)}
  .fill{height:100%;border-radius:20px;transition:width .5s ease}

  /* Mode buttons */
  .modes{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
  @media (max-width:560px){.modes{grid-template-columns:1fr}}
  .mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 16px;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .mode:hover{transform:translateY(-2px);border-color:var(--ink-2);box-shadow:0 6px 18px -12px rgba(28,39,64,.5)}
  .mode:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;border-color:var(--line)}
  .mode .mt{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;margin-bottom:4px}
  .mode .badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
  .mode .badge.due{background:var(--seal);color:#fff;border-color:var(--seal)}
  .mode .md{font-size:12.5px;color:var(--muted);line-height:1.45}
  .mode.primary{background:var(--ink);border-color:var(--ink)}
  .mode.primary .mt,.mode.primary .md{color:#fff}
  .mode.primary .md{color:#C3CAD6}
  .mode.primary .badge{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.2)}
  .mode.primary:hover{box-shadow:0 10px 24px -12px rgba(28,39,64,.8)}

  .subpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:13px;font-weight:600;padding:8px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  .chip:hover{border-color:var(--ink-2)}

  /* Study screen */
  .study-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .back{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
  .back:hover{color:var(--ink);border-color:var(--ink-2)}
  .prog{flex:1;height:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--ink);border-radius:20px;transition:width .35s ease}
  .prog-txt{font-family:var(--mono);font-size:12.5px;color:var(--muted);min-width:44px;text-align:right}

  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 24px 22px;box-shadow:0 1px 0 var(--line-2)}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:.2px}
  .tag.subj{background:var(--ink);color:#fff}
  .tag.origin{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
  .tag.diff{font-family:var(--mono);letter-spacing:.2px}
  .tag.diff.d1{background:#EAF0FA;color:#3A5BA0;border:1px solid #CFDDF2}
  .tag.diff.d2{background:#F6EFDD;color:#8A6D1F;border:1px solid #EADFC2}
  .tag.diff.d3{background:#F7E3E1;color:#B23A3A;border:1px solid #E8CBC7}
  .difffilter{display:inline-flex;gap:6px;flex-wrap:wrap}
  .difffilter .df{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  .difffilter .df:hover{border-color:var(--ink-2)}
  .difffilter .df.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .boxdots{display:flex;gap:3px;margin-left:auto;align-items:center}
  .boxdots .bl{font-size:10.5px;color:var(--faint);margin-right:4px;letter-spacing:.3px}
  .boxdots i{width:9px;height:9px;border-radius:50%;background:var(--b0);box-shadow:inset 0 0 0 1px var(--line)}
  .boxdots i.on{box-shadow:none}
  .qtext{font-size:17px;line-height:1.6;font-weight:600;color:var(--ink);padding-left:14px;border-left:3px solid var(--seal);margin-bottom:18px;word-break:keep-all}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;font-size:14.5px;line-height:1.5;transition:border-color .12s,background .12s;word-break:keep-all}
  .opt:hover:not(:disabled){border-color:var(--ink-2);background:var(--surface-2)}
  .opt:disabled{cursor:default}
  .opt .no{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted);margin-top:-1px}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg)}
  .opt.correct .no{background:var(--correct);border-color:var(--correct);color:#fff}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
  .opt.wrong .no{background:var(--wrong);border-color:var(--wrong);color:#fff}
  .opt.dim{opacity:.55}

  .verdict{margin-top:18px;padding:15px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .verdict .vh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;margin-bottom:6px}
  .verdict.ok .vh{color:var(--correct)}
  .verdict.no .vh{color:var(--wrong)}
  .verdict .ex{font-size:13.5px;color:var(--ink-2);line-height:1.55;word-break:keep-all}
  .verdict .ex b{color:var(--seal);font-weight:700}

  .actionbar{margin-top:18px;display:flex;gap:10px;align-items:center}
  .btn{font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:11px;background:var(--ink);color:#fff;transition:transform .12s,opacity .12s}
  .btn:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink-2)}
  .kbd-hint{font-size:11.5px;color:var(--faint);margin-left:auto}
  .kbd-hint kbd{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10.5px}

  /* Summary */
  .summary{text-align:center;padding:20px 8px}
  .summary .ring{width:150px;height:150px;margin:6px auto 16px}
  .summary h2{font-size:20px;font-weight:800;margin-bottom:6px}
  .summary .sline{font-size:14px;color:var(--muted);margin-bottom:22px}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:440px;margin:0 auto 24px}
  .sbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 8px}
  .sbox .n{font-size:24px;font-weight:800}
  .sbox .l{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sbox.up .n{color:var(--correct)}
  .sbox.down .n{color:var(--seal)}

  .empty{text-align:center;padding:40px 16px;color:var(--muted)}
  .empty .big{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .foot{margin-top:26px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6}

  /* Top navbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid var(--ink);margin-bottom:18px}
  .topbar .logo{display:flex;align-items:center;gap:10px}
  .topbar .logo h1{font-size:17px;font-weight:800;letter-spacing:-.5px}
  .topbar .nav-tabs{display:flex;gap:4px}
  .topbar .nav-tab{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;color:var(--muted);transition:all .15s}
  .topbar .nav-tab:hover{color:var(--ink);background:var(--surface-2)}
  .topbar .nav-tab.on{color:#fff;background:var(--ink)}
  .topbar .nav-tab .tab-badge{font-family:var(--mono);font-size:10px;margin-left:4px;padding:1px 5px;border-radius:10px;background:var(--seal);color:#fff}

  /* Quick start cards */
  .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  @media (max-width:560px){.quick-grid{grid-template-columns:1fr}}
  .quick-card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center;transition:transform .12s,border-color .12s,box-shadow .12s}
  .quick-card:hover{transform:translateY(-2px);border-color:var(--ink-2);box-shadow:0 6px 18px -12px rgba(28,39,64,.4)}
  .quick-card .qc-icon{font-size:28px;margin-bottom:8px}
  .quick-card .qc-title{font-size:14px;font-weight:800;margin-bottom:4px}
  .quick-card .qc-desc{font-size:11.5px;color:var(--muted);line-height:1.4}
  .quick-card .qc-count{font-family:var(--mono);font-size:20px;font-weight:800;color:var(--seal);margin:6px 0 2px}
  .quick-card.primary{background:var(--ink);border-color:var(--ink)}
  .quick-card.primary .qc-title,.quick-card.primary .qc-count{color:#fff}
  .quick-card.primary .qc-desc{color:#C3CAD6}
  .quick-card.primary:hover{box-shadow:0 8px 20px -10px rgba(28,39,64,.7)}

  .diff-main{margin-bottom:14px}
  .diff-main .dm-title{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:8px}
  .diff-cards{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto}
  .diff-card{flex:none;display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--line);border-radius:20px;padding:5px 12px;text-align:center;transition:all .12s;cursor:pointer}
  .diff-card:hover{border-color:var(--ink-2)}
  .diff-card.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .diff-card .dc-label{font-size:12px;font-weight:600}
  .diff-card .dc-sub{font-size:10px;color:var(--faint);font-family:var(--mono)}
  .diff-card.on .dc-sub{color:rgba(255,255,255,.7)}

  .subj-row{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .subj-chip{flex:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2);transition:all .12s;white-space:nowrap}
  .subj-chip:hover{border-color:var(--ink-2)}

  .stat-compact{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .sc-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
  .sc-item b{font-size:13px;color:var(--ink);font-weight:700}

  /* Toggle switch */
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .toggle-row .tl{display:flex;align-items:center;gap:8px}
  .toggle-row .tl-icon{font-size:18px}
  .toggle-row .tl-text{font-size:13px;font-weight:700}
  .toggle-row .tl-sub{font-size:11px;color:var(--muted)}
  .toggle{position:relative;width:44px;height:24px;flex:none}
  .toggle input{opacity:0;width:0;height:0}
  .toggle .slider{position:absolute;inset:0;background:var(--line);border-radius:24px;cursor:pointer;transition:background .2s}
  .toggle .slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .toggle input:checked+.slider{background:var(--correct)}
  .toggle input:checked+.slider::before{transform:translateX(20px)}

  /* Hamburger menu */
  .hamburger{font-size:20px;padding:6px;border-radius:8px;line-height:1}
  .hamburger:hover{background:var(--surface-2)}
  .menu-overlay{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.3)}
  .menu-panel{position:fixed;top:0;right:0;z-index:100;width:260px;max-width:80vw;height:100%;background:var(--surface);box-shadow:-4px 0 24px rgba(0,0,0,.15);padding:24px 16px;overflow-y:auto;animation:slideIn .2s ease}
  @keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);transition:background .12s}
  .menu-item:hover{background:var(--surface-2)}
  .menu-item[aria-current="true"]{background:var(--ink);color:#fff}
  .menu-divider{height:1px;background:var(--line);margin:8px 0}
  .menu-stage-label{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:1px;text-transform:uppercase;padding:8px 14px}

  /* Pass/fail card */
  .pf-card{margin:16px 0;padding:16px;border-radius:12px;border:1px solid var(--line)}
  .pf-card.pass{background:var(--correct-bg);border-color:var(--correct)}
  .pf-card.fail{background:var(--wrong-bg);border-color:var(--wrong)}
  .pf-head{font-weight:800;font-size:16px;margin-bottom:10px}
  .pf-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
  .pf-avg{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:14px;font-weight:700}

  /* Essay mode */
  .essay-prompt{padding:20px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;margin-top:18px;text-align:center}
  .essay-prompt .ep-msg{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.5}
  .model-answer{margin-top:18px;padding:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
  .model-answer .ma-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
  .model-answer .ma-body{font-size:14px;line-height:1.7;color:var(--ink);white-space:pre-line;word-break:keep-all}
  .kw-title{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 10px}
  .kw-list{display:flex;flex-direction:column;gap:8px}
  .kw-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13.5px;cursor:pointer;transition:border-color .12s}
  .kw-item:hover{border-color:var(--ink-2)}
  .kw-item.checked{border-color:var(--correct);background:var(--correct-bg)}
  .kw-item.unsure{border-color:var(--gold);background:#FDF6E3}
  .kw-item input{width:16px;height:16px;accent-color:var(--correct)}
  .kw-weight{font-size:10px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
  .essay-score{margin-top:16px;padding:14px;border-radius:12px;text-align:center;font-weight:800;font-size:15px}
  .essay-score.pass{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
  .essay-score.fail{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong)}
  /* Answer sheet */
  .ans-sheet{margin-top:18px}
  .ans-title{font-size:14px;font-weight:800;margin-bottom:4px}
  .ans-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .ans-list{display:flex;flex-direction:column;gap:6px}
  .ans-slot{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;transition:all .15s;min-height:46px}
  .ans-slot:hover{border-color:var(--ink-2)}
  .ans-slot.shown{border-style:solid;border-color:var(--correct);background:var(--correct-bg)}
  .ans-no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
  .ans-slot.shown .ans-no{background:var(--correct);border-color:var(--correct);color:#fff}
  .ans-blank{font-size:13px;color:var(--faint);font-style:italic}
  .ans-kw{font-size:14px;font-weight:600;color:var(--correct)}

  .qtext table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
  .qtext th,.qtext td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  .qtext th{background:var(--surface-2);font-weight:700}
</style>

<script>
/* ============================== QUESTION BANK (questions.json) ============================== */
let BANK = [];
async function loadQuestions() {
  const resp = await fetch('questions.json');
  BANK = await resp.json();
}
</script>

<script>
/* ============================== ENGINE ============================== */

/* --- 상수 --- */
const STAGES = {
  "1": { subjects: ["민법","부동산관계법규","토지보상법규"], label: "1차 시험", examSize: 25 },
  "2": { subjects: ["보상실무1","보상실무2"], label: "2차 시험", examSize: 20 }
};
const SUBJ_COLOR = {"민법":"#3A5BA0","부동산관계법규":"#8A6D1F","토지보상법규":"#2E7D57","보상실무1":"#6B4C9A","보상실무2":"#C97539"};
const BOX_INTERVALS = [1,2,4,8,16];
const MAX_BOX = 5;
const QUEUE_REVIEW = 20;
const QUEUE_PRACTICE = 15;
const NUM = ["①","②","③","④","⑤"];

function migrateIdProgress(data){
  if(!data||!data.cards) return data;
  const hasOld=Object.keys(data.cards).some(k=>!k.match(/^(civ|rel|lca|prc[12])-\d{3}$/));
  if(!hasOld) return data;
  const nc={};
  Object.entries(data.cards).forEach(([oid,card])=>{ const nid=ID_MIGRATION[oid]; if(nid) nc[nid]=card; });
  data.cards=nc; data.version=4;
  return data;
}
function migrateToV5(data){
  data=migrateIdProgress(data);
  const p={version:5,
    "1":{cards:data.cards||{},totalAnswered:data.totalAnswered||0,totalCorrect:data.totalCorrect||0,studyDays:Array.isArray(data.studyDays)?data.studyDays:[]},
    "2":blankStageProgress("2")
  };
  BANK.filter(q=>(q.stage||1)===1).forEach(q=>{ if(!p["1"].cards[q.id]) p["1"].cards[q.id]={box:0,seen:0,correct:0,wrong:0,lastDay:null,dueDay:0}; });
  return p;
}

async function loadProgress(){
  const saved=await store.get(STORE_KEY);
  if(saved&&saved.version>=5&&saved["1"]&&saved["2"]){
    // 구조 검증
    if(typeof saved["1"].cards!=='object'||saved["1"].cards===null) saved["1"]=blankStageProgress("1");
    if(typeof saved["2"].cards!=='object'||saved["2"].cards===null) saved["2"]=blankStageProgress("2");
    BANK.forEach(q=>{ const s=String(q.stage||1); if(!saved[s].cards[q.id]) saved[s].cards[q.id]={box:0,seen:0,correct:0,wrong:0,lastDay:null,dueDay:0}; });
    P=saved;
  } else if(saved&&(saved.cards||saved.version)){
    P=migrateToV5(saved);
  } else {
    P=blankProgress();
  }
}
async function saveProgress(){ await store.set(STORE_KEY,P); }

/* --- 학습 로직 --- */
function markStudied(){ const d=todayNum(); if(!sp().studyDays.includes(d)) sp().studyDays.push(d); }
function currentStreak(){
  const days=sp().studyDays; if(!days.length) return 0;
  const set=new Set(days); let d=todayNum();
  if(!set.has(d)&&!set.has(d-1)) return 0;
  let start=set.has(d)?d:d-1,s=0;
  while(set.has(start)){s++;start--;}
  return s;
}
function applyResult(id,ok){
  const c=sp().cards[id]; if(!c) return;
  c.seen++; sp().totalAnswered++;
  if(ok){ c.correct++; sp().totalCorrect++; c.box=Math.min(MAX_BOX,(c.box||0)+1); }
  else { c.wrong++; c.box=1; }
  c.lastDay=todayNum();
  c.dueDay=todayNum()+BOX_INTERVALS[Math.max(0,c.box-1)];
}
function masteryPct(){
  const bank=stageBank(); if(!bank.length) return 0;
  let sum=0; bank.forEach(q=>sum+=(sp().cards[q.id]?.box||0));
  return Math.round((sum/(bank.length*MAX_BOX))*100);
}
function subjMastery(s){
  const qs=stageBank().filter(q=>q.subject===s);
  if(!qs.length) return {pct:0,n:0,mastered:0,seen:0};
  let sum=0; qs.forEach(q=>sum+=(sp().cards[q.id]?.box||0));
  return {pct:Math.round((sum/(qs.length*MAX_BOX))*100),n:qs.length,mastered:qs.filter(q=>(sp().cards[q.id]?.box||0)>=MAX_BOX).length,seen:qs.filter(q=>(sp().cards[q.id]?.seen||0)>0).length};
}
function dfilter(a){ return filterDiff?a.filter(q=>(q.diff||2)===filterDiff):a; }
function diffMastery(d){ const qs=stageBank().filter(q=>(q.diff||2)===d); if(!qs.length) return {pct:0,n:0,mastered:0}; let s=0; qs.forEach(q=>s+=(sp().cards[q.id]?.box||0)); return {pct:Math.round(s/(qs.length*MAX_BOX)*100),n:qs.length,mastered:qs.filter(q=>(sp().cards[q.id]?.box||0)>=MAX_BOX).length}; }
function dueCards(){ const t=todayNum(); return stageBank().filter(q=>{const c=sp().cards[q.id]; return !c||c.seen===0||c.dueDay<=t;}); }
function weakCards(){ return stageBank().filter(q=>{const c=sp().cards[q.id]; return !c||c.box<=2||c.wrong>c.correct;}); }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* --- 과락 계산 --- */
function calcPassFail(answers,queue){
  const subjects=stageSubjects();
  const perSubj={}; subjects.forEach(s=>perSubj[s]={total:0,correct:0});
  queue.forEach(id=>{
    const q=BANK_MAP[id]; if(!q) return;
    if(!perSubj[q.subject]) perSubj[q.subject]={total:0,correct:0};
    perSubj[q.subject].total++;
    if(answers[id]===q.a) perSubj[q.subject].correct++;
  });
  const results=subjects.map(s=>{
    const d=perSubj[s]; const score=d.total?Math.round(d.correct/d.total*100):0;
    return {subject:s,score,total:d.total,correct:d.correct,gwarak:score<40};
  });
  const avg=results.length?Math.round(results.reduce((s,r)=>s+r.score,0)/results.length):0;
  const anyGwarak=results.some(r=>r.gwarak);
  return {results,avgScore:avg,pass:avg>=60&&!anyGwarak,anyGwarak};
}

/* --- 큐 빌드 --- */
function buildQueue(mode,subject){
  let pool;
  if(mode==='review'){ pool=dfilter(dueCards()); if(randomMode) pool=shuffle(pool); else pool.sort((a,b)=>(sp().cards[a.id]?.box||0)-(sp().cards[b.id]?.box||0)); pool=pool.slice(0,QUEUE_REVIEW); }
  else if(mode==='weak'){ pool=dfilter(weakCards()); pool=randomMode?shuffle(pool).slice(0,Math.min(QUEUE_REVIEW,pool.length)):weightedPick(pool,Math.min(QUEUE_REVIEW,pool.length||1)); }
  else if(mode==='practice'){ let p=dfilter(subject==='전체'?stageBank():stageBank().filter(q=>q.subject===subject)); pool=randomMode?shuffle(p).slice(0,Math.min(QUEUE_PRACTICE,p.length)):weightedPick(p,Math.min(QUEUE_PRACTICE,p.length)); }
  return pool.map(q=>q.id);
}
function weightedPick(pool,n){
  let items=pool.map(q=>({q,w:MAX_BOX+1-(sp().cards[q.id]?.box||0)})); let out=[];
  for(let k=0;k<n&&items.length;k++){
    let tot=items.reduce((s,i)=>s+i.w,0),r=Math.random()*tot,acc=0,pick=0;
    for(let i=0;i<items.length;i++){acc+=items[i].w;if(r<=acc){pick=i;break;}}
    out.push(items[pick].q);items.splice(pick,1);
  }
  return out;
}

/* --- 모의고사 균등 추출 (작업 7) --- */
function buildBalancedExam(){
  const subjects=stageSubjects();
  const total=STAGES[curStage].examSize;
  const base=Math.floor(total/subjects.length);
  const remainder=total%subjects.length;
  let insufficient=false;
  const pool=[];
  subjects.forEach((s,i)=>{
    const available=dfilter(stageBank().filter(q=>q.subject===s));
    const want=base+(i<remainder?1:0);
    const take=Math.min(want,available.length);
    if(take<want) insufficient=true;
    pool.push(...shuffle(available).slice(0,take));
  });
  return {pool:shuffle(pool),insufficient};
}

function startMode(mode){
  const q=buildQueue(mode);
  if(!q.length){ toastEmpty(mode); return; }
  session={queue:q,idx:0,answers:{},mode,examMode:false,correctCount:0,levelUp:0,levelDown:0};
  render();
}
function startSubject(mode,subject){
  const q=buildQueue(mode,subject);
  if(!q.length){ toastEmpty(mode); return; }
  session={queue:q,idx:0,answers:{},mode,subject,examMode:false,correctCount:0,levelUp:0,levelDown:0};
  render();
}
function startExam(){
  const {pool,insufficient}=buildBalancedExam();
  if(!pool.length){ toastEmpty('exam'); return; }
  session={queue:pool.map(q=>q.id),idx:0,answers:{},mode:'exam',subject:STAGES[curStage].label,examMode:true,correctCount:0,levelUp:0,levelDown:0,insufficient};
  render();
}
function toastEmpty(mode){
  const msg=mode==='review'?'오늘 복습할 문항이 없습니다. 모든 문항을 예정대로 학습했습니다 — 약점 집중이나 과목별 연습을 해보세요.':'해당하는 문항이 없습니다.';
  alert(msg);
}

  } else {
    verdict=`<div class="actionbar"><span class="kbd-hint"><kbd>1</kbd>~<kbd>5</kbd> 로 답 선택</span></div>`;

  const srcTag=q.source&&q.source[0]?(q.source[0].year?`기출 ${q.source[0].year} ${q.source[0].no||''}번`:q.source[0].type):'';

  root.innerHTML=topbar()+`
  <div class="study-top">
    <button class="back" onclick="quitSession()">← 그만두기</button>

function answer(i){
  const id=session.queue[session.idx],q=BANK_MAP[id];
  if(session.answers[id]!==undefined) return;
  session.answers[id]=i;
  const before=sp().cards[id]?.box||0,ok=i===q.a;
  applyResult(id,ok);
  if(ok){session.correctCount++;if((sp().cards[id]?.box||0)>before)session.levelUp++;}
  else {if((sp().cards[id]?.box||0)<before)session.levelDown++;}
  markStudied();saveProgress();
  renderStudy();
}
function next(){
  if(session.idx+1<session.queue.length){session.idx++;renderStudy();}

/* -------- Essay mode -------- */
// 상태: undefined(답안지 단계) → 'pending'(힌트 진행중) → 'revealed'(정답 확인) → 숫자(채점 완료)
function renderEssay(){
  const id=session.queue[session.idx],q=BANK_MAP[id],c=sp().cards[id]||{box:0};
  const total=session.queue.length,pos=session.idx+1;
  const phase=session.answers[id]; // undefined | 'pending' | 'revealed' | number
  const kws=q.keywords||[];
  const hints=session._essayHints||(session._essayHints=new Set());
  const boxdots=Array.from({length:MAX_BOX},(_,i)=>`<i class="${i<c.box?'on':''}" style="${i<c.box?`background:${['','var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)'][i+1]}`:''}"></i>`).join('');

  let body='';
  if(phase===undefined||phase==='pending'){
    // 답안지 UI: 번호가 매겨진 빈 항목, 클릭하면 힌트 키워드 표시
    const answerSheet=kws.map((kw,i)=>{
      const shown=hints.has(i);
      return `<div class="ans-slot ${shown?'shown':''}" onclick="revealHint(${i})">
        <span class="ans-no">${i+1}</span>
        ${shown?`<span class="ans-kw">${kw.term}</span>`:`<span class="ans-blank">탭하여 힌트 확인</span>`}
      </div>`;
    }).join('');
    const allRevealed=hints.size>=kws.length;
    body=`<div class="ans-sheet">
      <div class="ans-title">📝 답안지 — 핵심 키워드를 떠올려 보세요</div>
      <div class="ans-sub">항목을 탭하면 힌트가 표시됩니다 (${hints.size}/${kws.length})</div>
      <div class="ans-list">${answerSheet}</div>
      <div class="actionbar" style="margin-top:14px">
        <button class="btn" onclick="showFullAnswer()">정답 확인</button>
        ${!allRevealed?`<span class="kbd-hint">${kws.length-hints.size}개 항목 남음</span>`:''}
      </div>
    </div>`;
  } else if(phase==='revealed'){
    // 정답 확인: 모범답안 + 자가 채점
    const checks=session._essayChecks||{};
    const kwHtml=kws.map((kw,i)=>{
      const st=checks[i]||'none';
      return `<div class="kw-item ${st==='checked'?'checked':st==='unsure'?'unsure':''}" onclick="toggleKw(${i})">
        <input type="checkbox" ${st==='checked'?'checked':''} onclick="event.stopPropagation();toggleKw(${i})">
        <span>${kw.term}</span>
        ${kw.weight>1?`<span class="kw-weight">×${kw.weight}</span>`:''}
      </div>`;
    }).join('');
    body=`<div class="model-answer">
      <div class="ma-title">모범답안</div>
      <div class="ma-body">${q.model||''}</div>
    </div>
    <div class="kw-title">키워드 자가 채점 (확실히 알고 있던 항목만 체크)</div>
    <div class="kw-list">${kwHtml}</div>
    <div class="actionbar">
      <button class="btn" onclick="gradeEssay()">채점하기</button>
      <span class="kbd-hint">알고 있던 키워드만 체크하세요</span>
    </div>`;
  } else {
    // 채점 완료
    const sc=phase;
    body=`<div class="model-answer">
      <div class="ma-title">모범답안</div>
      <div class="ma-body">${q.model||''}</div>
    </div>
    <div class="essay-score ${sc>=80?'pass':'fail'}">${sc>=80?'✓ 숙달':'✕ 복습 필요'} · 키워드 달성률 ${sc}%</div>
    <div class="actionbar"><button class="btn" onclick="next()">${pos<total?'다음 문항 →':'세션 마치기'}</button></div>`;
  }

  root.innerHTML=topbar()+`
  <div class="study-top">
    <button class="back" onclick="quitSession()">← 그만두기</button>
    <div class="prog"><i style="width:${Math.round(pos/total*100)}%"></i></div>
    <div class="prog-txt">${pos}/${total}</div>
  </div>
  <div class="qcard">
    <div class="qmeta">
      <span class="tag subj">${q.subject}</span>
      <span class="tag diff d${q.diff||2}">${'★'.repeat(q.diff||2)} ${['','기초','표준','심화'][q.diff||2]}</span>

    </div>
    <div class="qtext">${q.q}</div>
    ${body}
  </div>`;
}

function revealHint(i){
  if(!session._essayHints) session._essayHints=new Set();
  session._essayHints.add(i);
  if(!session.answers[session.queue[session.idx]]) session.answers[session.queue[session.idx]]='pending';
  renderEssay();
}

function showFullAnswer(){
  const id=session.queue[session.idx];
  session.answers[id]='revealed';
  session._essayChecks={};
  renderEssay();
}

function toggleKw(i){
  if(!session._essayChecks) session._essayChecks={};
  const cur=session._essayChecks[i]||'none';
  session._essayChecks[i]=cur==='none'?'checked':cur==='checked'?'unsure':'none';
  renderEssay();
}

function gradeEssay(){
  const id=session.queue[session.idx],q=BANK_MAP[id];
  const kws=q.keywords||[];
  const checks=session._essayChecks||{};
  // 가중 합계 채점: checked만 점수, unsure는 제외
  let earned=0,total=0;
  kws.forEach((kw,i)=>{
    total+=kw.weight||1;
    if(checks[i]==='checked') earned+=kw.weight||1;
  });
  const score=total?Math.round(earned/total*100):0;
  session.answers[id]=score;
  const ok=score>=80;
  const before=sp().cards[id]?.box||0;
  applyResult(id,ok);
  if(ok){session.correctCount++;if((sp().cards[id]?.box||0)>before)session.levelUp++;}
  else {if((sp().cards[id]?.box||0)<before)session.levelDown++;}
  markStudied();saveProgress();
  renderEssay();
}

function gradeExam(){

  markStudied();saveProgress();
  const total=session.queue.length,score=Math.round(correct/total*100);

    <div class="pf-head" style="color:${pf.pass?'var(--correct)':'var(--wrong)'}">${pf.pass?'합격 (PASS)':'불합격 (FAIL)'}${pf.anyGwarak&&pf.avgScore>=60?' — 과락 과목 있음':''}</div>
    ${pf.results.map(r=>`<div class="pf-row"><span>${r.subject}</span><span style="font-weight:700;color:${r.gwarak?'var(--wrong)':'var(--ink)'}">${r.score}점 ${r.gwarak?'(과락 위험 — 40점 미만)':''}</span></div>`).join('')}
    <div class="pf-avg"><span>평균</span><span style="color:${pf.avgScore>=60?'var(--correct)':'var(--wrong)'}">${pf.avgScore}점 ${pf.avgScore>=60?'(60점 이상)':'(60점 미만)'}</span></div>
  </div>`;

  const rows=session.queue.map((id,n)=>{
    const q=BANK_MAP[id],ch=session.answers[id],ok=ch===q.a;
    return `<div style="padding:12px 0;border-bottom:1px solid var(--line-2)">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <span class="mono" style="color:${ok?'var(--correct)':'var(--wrong)'};font-weight:800;flex:none">${ok?'✓':'✕'} ${n+1}.</span>
        <div style="flex:1">
          <div style="font-size:13.5px;font-weight:600;line-height:1.5;word-break:keep-all">${q.q}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:5px">내 답 ${NUM[ch]} · 정답 <b style="color:var(--correct)">${NUM[q.a]}</b></div>
          <div style="font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.5;word-break:keep-all">${q.ex}</div>
        </div>
      </div></div>`;
  }).join('');
  const col=score>=80?'var(--correct)':score>=60?'var(--gold)':'var(--seal)';
  root.innerHTML=topbar()+`
  <div class="card"><div class="summary" style="padding-bottom:8px">
    <div class="eyebrow">채점 결과 · ${session.subject}</div>
    <h2 style="margin-top:10px;font-size:40px;color:${col}">${correct*ptsPer}<span style="font-size:18px;color:var(--muted)"> / 100점</span></h2>
    <div class="sline">${total}문항 중 ${correct}문항 정답 · ${score}%</div>
    ${pfHtml}
  </div>
  <div style="margin-top:6px"><div class="eyebrow" style="margin-bottom:6px">문항별 해설</div>${rows}</div>
  <div class="actionbar" style="justify-content:center;margin-top:20px">
    <button class="btn" onclick="quitSession()">돌아가기</button>
  </div></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* -------- keyboard -------- */
document.addEventListener('keydown',e=>{
  if(!session) return;
  if(session.examMode){
    const id=session.queue[session.idx];
    if(e.key>='1'&&e.key<='5') examPick(+e.key-1);
    else if(e.key==='Enter'){if(session.answers[id]!==undefined) examNext();}
    return;
  }
  const id=session.queue[session.idx];
  const answered=session.answers[id]!==undefined;
  if(!answered&&e.key>='1'&&e.key<='5') answer(+e.key-1);
  else if(answered&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();}
});

function confirmReset(){
  if(confirm(`${STAGES[curStage].label}의 모든 학습 기록을 초기화합니다. 계속할까요?`)){
    P[curStage]=blankStageProgress(curStage); saveProgress(); session=null; render();
  }
}

/* -------- boot -------- */
(async()=>{
  await loadQuestions();
  BANK_MAP=Object.fromEntries(BANK.map(q=>[q.id,q]));
  const savedStage=await store.get(STAGE_KEY);
  if(savedStage==="1"||savedStage==="2") curStage=savedStage;
  await loadProgress();
  await saveProgress();
  render();
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
</body>
</html>
